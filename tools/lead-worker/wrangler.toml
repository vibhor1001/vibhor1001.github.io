# Deploy with:  npx wrangler deploy      (or paste worker.js into the Cloudflare dashboard editor)
# The key is NOT here. Set it as a secret:  npx wrangler secret put CRM_API_KEY
name = "pf-lead"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
CRM_URL = "https://backend-production-7a92.up.railway.app/api/v1/public/leads"
ALLOWED_ORIGINS = "https://www.propertyflow.uk,https://vibhor1001.github.io"

# Optional, stronger rate limiting than the built-in fallback (5 per minute per visitor):
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
#   [ratelimits.simple]
#   limit = 5
#   period = 60
